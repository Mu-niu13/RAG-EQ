<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }
    .chat-container {
      width: 400px;
      max-height: 80vh;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
    }
    .message {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 70%;
    }
    .user {
      align-self: flex-end;
      background-color: #dcf8c6;
    }
    .bot {
      align-self: flex-start;
      background-color: #e6e6e6;
    }
    .chat-input {
      display: flex;
      padding: 10px;
    }
    .chat-input input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .chat-input button {
      margin-left: 8px;
      padding: 8px 12px;
    }
    .quick-questions {
      margin: 10px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .quick-questions button {
      padding: 6px 10px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .quick-questions button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="quick-questions">
    <button onclick="quickAsk('My friend wants to copy your homework because they were out sick. What should I do?')">Your friend wants to copy your homework because they were out sick. What should I do?</button>
    <button onclick="quickAsk('My teammate constantly interrupts me in meetings. What can I do?')">My teammate constantly interrupts me in meetings. What can I do?</button>
    <button onclick="quickAsk('I take work criticism very personally. How can I reframe it?')">I take work criticism very personally. How can I reframe it?</button>
    <button onclick="quickAsk('How do I manage passive-aggressive coworkers?')">How do I manage passive-aggressive coworkers?</button>
  </div>

    <script>
      const API_URL = "http://localhost:8000/rag/";

      function addMessage(text, sender) {
        const chat = document.getElementById("chat-messages");
        const msg = document.createElement("div");
        msg.className = `message ${sender}`;
        msg.textContent = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendMessage() {
        const input = document.getElementById("user-input");
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: text })
          });

          const data = await response.json();
          addMessage(data.answer || "Please try another question", "bot");
        } catch (error) {
          console.error("Error:", error);
          addMessage("Please try it later", "bot");
        }
      }

      function quickAsk(text) {
        document.getElementById("user-input").value = text;
        sendMessage();
      }
    </script>


</body>
</html>
